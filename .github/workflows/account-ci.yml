name: Account Service CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  account-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goa_account_ci
          POSTGRES_USER: goa_account
          POSTGRES_PASSWORD: goa_account_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goa_account -d goa_account_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://goa_account:goa_account_password@127.0.0.1:5432/goa_account_ci
      SUPABASE_JWT_SECRET: test-secret-that-is-at-least-32-bytes
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWT_ISSUER: ""
      ALLOW_DEV_AUTH_HEADER: "false"
      ENABLE_API_DOCS: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m black --check services/account

      - name: Check Django project
        working-directory: services/account
        run: python manage.py check

      - name: Check migrations
        working-directory: services/account
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: services/account
        run: python manage.py migrate --noinput

      - name: Validate API schema
        working-directory: services/account
        run: python manage.py spectacular --validate --file /tmp/account-schema.yaml

      - name: Run tests
        working-directory: services/account
        run: python manage.py test
